<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小鱼塘</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="/src/settings.css" />
  <link rel="stylesheet" href="/src/editor.css" />
  <link rel="stylesheet" href="/src/achievements.css" />
  <link rel="stylesheet" href="/src/achievements-panel.css" />
</head>
<body>
  <canvas id="pond"></canvas>
  <canvas id="creatures"></canvas>

  <!-- Toggle Toolbar -->
  <div id="toolbar">
    <button id="btn-settings" class="tool-btn" title="设置 (P)">⚙</button>
    <button id="btn-editor" class="tool-btn" title="编辑器 (E)">🐟</button>
    <button id="btn-achievements" class="tool-btn" title="成就 (F4)">🏆</button>
    <button id="btn-interact" class="tool-btn" title="交互模式 (F2)">👆</button>
    <button id="btn-scene" class="tool-btn" title="切换场景 (S)">🏞</button>
    <button id="btn-tool" class="tool-btn" title="切换工具 (Tab)">🔧</button>
  </div>

  <!-- Settings Panel -->
  <div id="settings" class="glass-panel">
    <div class="panel-header">
      <h3>设置</h3>
      <button id="st-close" class="btn btn-ghost">✕</button>
    </div>
    <div class="st-body">
      <div class="st-group">
        <span class="section-label">场景模式</span>
        <div class="btn-grid">
          <button id="st-mode-pond" class="btn btn-sm active">池塘</button>
          <button id="st-mode-immersive" class="btn btn-sm">沉浸</button>
        </div>
      </div>
      <div class="st-group">
        <span class="section-label">池塘形状</span>
        <div class="btn-grid">
          <button id="st-shape-circle" class="btn btn-sm active">圆形</button>
          <button id="st-shape-oval" class="btn btn-sm">椭圆</button>
          <button id="st-shape-irregular" class="btn btn-sm">不规则</button>
          <button id="st-shape-rect" class="btn btn-sm">方圆</button>
        </div>
      </div>
      <div class="st-group">
        <span class="section-label">水色</span>
        <div class="btn-grid">
          <button id="st-color-clear" class="swatch-btn active" style="background:linear-gradient(135deg,#1a738a,#0a2a4a);" title="清澈蓝"></button>
          <button id="st-color-jade" class="swatch-btn" style="background:linear-gradient(135deg,#1a8a5a,#0a3a2a);" title="翡翠绿"></button>
          <button id="st-color-dusk" class="swatch-btn" style="background:linear-gradient(135deg,#5a3a8a,#2a1a4a);" title="暮色紫"></button>
          <button id="st-color-deep" class="swatch-btn" style="background:linear-gradient(135deg,#0a5a8a,#0a1a2a);" title="深海蓝"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Creature Editor -->
  <div id="editor" class="glass-panel">
    <div class="panel-header">
      <h3>自定义生物</h3>
      <button id="ed-close" class="btn btn-ghost">✕</button>
    </div>
    <div class="ed-body">
      <div class="form-row">
        <label>名字</label>
        <input id="ed-name" type="text" value="小金" placeholder="输入名字" />
      </div>
      <div class="form-row">
        <label>物种</label>
        <select id="ed-species">
          <option value="fish">鱼</option>
          <option value="frog">青蛙</option>
          <option value="crab">螃蟹</option>
          <option value="lobster">龙虾</option>
          <option value="eel">黄鳝</option>
        </select>
      </div>
      <div class="form-row">
        <label>体型</label>
        <input id="ed-size" type="range" min="0.5" max="2" step="0.1" value="1" />
      </div>
      <div class="form-row">
        <label>底色</label>
        <input id="ed-base-color" type="color" value="#FF8C00" />
      </div>
      <div class="form-row">
        <label>花纹</label>
        <select id="ed-pattern">
          <option value="solid">纯色</option>
          <option value="spots">斑点</option>
          <option value="stripes">条纹</option>
          <option value="gradient">渐变</option>
        </select>
      </div>
      <div class="form-row">
        <label>花纹色</label>
        <input id="ed-pattern-color" type="color" value="#FFFFFF" />
      </div>
      <canvas id="ed-preview" class="preview-canvas" width="260" height="100"></canvas>
      <div class="ed-actions">
        <button id="ed-save" class="btn btn-primary">放入池塘</button>
        <button id="ed-cancel" class="btn">取消</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
